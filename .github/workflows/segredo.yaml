on:
  workflow_dispatch:
  schedule:
    - cron: "49 17 * * *"

name: segredo.yaml

permissions: read-all

jobs:
  segredo:
    runs-on: ubuntu-24.04
    steps:
      - uses: r-lib/actions/setup-r@v2

      - name: Usa o segredo
        run: |
          print(nchar(Sys.getenv("MINHA_CHAVE")))
          print(Sys.getenv("MINHA_CHAVE"))
          print(toupper(Sys.getenv("MINHA_CHAVE")))
        shell: Rscript {0}
        env:
          MINHA_CHAVE: ${{ secrets.MINHA_CHAVE }}
